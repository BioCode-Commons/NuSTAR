<text x="854.0" y="457" class="small muted" text-anchor="middle">prepareSingleFastq()</text>
<path d="M854 478V496" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="650" y="496" width="408" height="70" rx="8" fill="#12251f" stroke="#3a4c48" />
<text x="854.0" y="521" class="nodeLabel" text-anchor="middle">Seed search → SeedBatch</text>
<text x="854.0" y="545" class="small muted" text-anchor="middle">seed.find(read, workspace, seeds)</text>
