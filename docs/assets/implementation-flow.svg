<text x="854.0" y="198" class="nodeLabel" text-anchor="middle">Build or load the native index</text>
<text x="854.0" y="222" class="small muted" text-anchor="middle">libsais64 → STAR rank normalization → pack</text>
<text x="854.0" y="245" class="small muted" text-anchor="middle">reference.bin / index.sa</text>
<path d="M854 269V319" fill="none" stroke="#6e7681" stroke-width="1.6" marker-end="url(#arrow)"/>
