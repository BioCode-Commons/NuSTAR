<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1138" viewBox="0 0 1120 1138" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">STAR and NuSTAR: end-to-end flow and processing boundaries</title>
<desc id="flow-desc">STAR and NuSTAR: end-to-end flow and processing boundaries. Source revisions: STAR 2.7.11b and NuSTAR bdf6bfa.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:19px;fill:#e6edf3}
.title{font-size:31px;font-weight:600}.heading{font-size:22px;font-weight:600}
.mono{font-family:Menlo,Consolas,monospace;font-size:17px}.small{font-size:16px}
.muted{fill:#9da7b3}.green{fill:#7ee787}.blue{fill:#79c0ff}.amber{fill:#e3b341}
.eyebrow{font-size:15px;letter-spacing:1.6px;fill:#9da7b3}.nodeLabel{font-size:19px;font-weight:600}
</style>
<rect x="0" y="0" width="1120" height="1138" rx="14" fill="#0d1117" />
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#6e7681"/></marker></defs>
<text x="32" y="37" class="eyebrow">01 / END-TO-END FLOW</text>
<text x="32" y="80" class="title">The same alignment strategy, with explicit stage boundaries.</text>
<text x="32" y="111" class="small muted">Standard spliced alignment; the NuSTAR lane expands its normal single-end pipeline.</text>
<text x="66" y="153" class="heading">STAR 2.7.11b</text>
<text x="622" y="153" class="heading green">NuSTAR</text>
<rect x="94" y="173" width="408" height="96" rx="8" fill="#1c212b" stroke="#303b4c" />
<text x="298.0" y="198" class="nodeLabel" text-anchor="middle">Build or load the reference index</text>
<text x="298.0" y="222" class="small muted" text-anchor="middle">Prefix chunks → qsort → packed suffix array</text>
<text x="298.0" y="245" class="small muted" text-anchor="middle">Genome / SA / SAindex</text>
