<text x="608" y="301" class="eyebrow">WORKER / NUMBERED BATCH LOOP</text>
<rect x="94" y="320" width="408" height="70" rx="8" fill="#1c212b" stroke="#303b4c" />
<text x="298.0" y="345" class="nodeLabel" text-anchor="middle">Read next chunk</text>
<text x="298.0" y="369" class="small muted" text-anchor="middle">Input mutex protects shared streams</text>
