name: Published benchmark
on:
  pull_request:
    paths: ['benchmarks/published.json', '.github/workflows/published-benchmark.yml']
  push:
    branches: [main]
    paths: ['benchmarks/published.json', '.github/workflows/published-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BioCode-Commons/BioCode-Commons.github.io
          path: .publisher
          persist-credentials: false
      - name: Validate published data
        env:
          PROJECT: ${{ github.event.repository.name }}
        run: python3 .publisher/scripts/benchmarks.py benchmarks/published.json "$PROJECT"
      - name: Notify website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PUBLISH_TOKEN: ${{ secrets.BENCHMARK_PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::warning::Immediate publication needs BENCHMARK_PUBLISH_TOKEN; website hourly polling remains available."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $PUBLISH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/BioCode-Commons/BioCode-Commons.github.io/dispatches \
            -d '{"event_type":"benchmark-published"}'
